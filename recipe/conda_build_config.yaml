c_compiler_version:        # [osx]
- '18'                     # [osx]
cxx_compiler_version:      # [osx]
- '18'                     # [osx]

c_compiler:                # [aarch64]
  - clang                  # [aarch64]
c_compiler_version:        # [aarch64]
  - 17                     # [aarch64]
cxx_compiler:              # [aarch64]
  - clangxx                # [aarch64]
cxx_compiler_version:      # [aarch64]
  - 17                     # [aarch64]

# Open3D 0.20.0 links the prebuilt Filament binaries that upstream builds on
# Ubuntu 22.04 (filament-v1.76.0-linux-22.04-{x86_64,aarch64}.tgz). Their
# libbackend.a references pthread_cond_clockwait, which glibc only gained in
# 2.30, so the 2.17 default leaves it undefined and every executable that links
# libOpen3D fails at link time. 2.34 is the lowest available sysroot that works.
c_stdlib_version:          # [linux]
  - '2.34'                 # [linux]
